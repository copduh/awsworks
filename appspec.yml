version: 0.0
os: linux
files:
  - source: /
    destination: /opt/sprintly
hooks:
  BeforeInstall:
    - location: scripts/install_java.sh
      timeout: 600
    - location: scripts/stop_server.sh
      timeout: 300
  AfterInstall:
    - location: scripts/prepare_environment.sh
      timeout: 300
  ApplicationStart:
    - location: scripts/start_server.sh
      timeout: 300
  ValidateService:
    - location: scripts/validate.sh
      timeout: 120
