AWSTemplateFormatVersion: '2010-09-09'
Description: >
  CodePipeline stack for Sprintly. Creates a GitHub CodeStar connection, CodeBuild
  project, and CodePipeline that builds backend artifacts and deploys them to
  EC2 via CodeDeploy while syncing frontend assets to S3.

Parameters:
  GitHubRepository:
    Type: String
    Description: GitHub repository in owner/name format

  GitHubBranch:
    Type: String
    Default: main

  ConnectionName:
    Type: String
    Default: sprintly-github-connection

  DBUser:
    Type: String
    Default: postgres

  FrontendBucketName:
    Type: String

  CloudFrontDistributionId:
    Type: String

Resources:

  PipelineArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub sprintly-pipeline-artifacts-${AWS::AccountId}-${AWS::Region}
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole

      Policies:
        - PolicyName: CodePipelinePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - s3:*
                Resource: "*"

              - Effect: Allow
                Action:
                  - codebuild:*
                Resource: "*"

              - Effect: Allow
                Action:
                  - codedeploy:*
                Resource: "*"

              - Effect: Allow
                Action:
                  - codestar-connections:UseConnection
                Resource: "*"

              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource: "*"

  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonS3FullAccess
        - arn:aws:iam::aws:policy/AWSCodeDeployFullAccess
        - arn:aws:iam::aws:policy/CloudFrontFullAccess
        - arn:aws:iam::aws:policy/AmazonSSMFullAccess
        - arn:aws:iam::aws:policy/AmazonEC2FullAccess

      Policies:
        - PolicyName: ExtraPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - codestar-connections:UseConnection
                Resource: "*"

  GitHubConnection:
    Type: AWS::CodeStarConnections::Connection
    Properties:
      ConnectionName: !Ref ConnectionName
      ProviderType: GitHub

  SprintlyBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: sprintly-build-project
      ServiceRole: !GetAtt CodeBuildRole.Arn

      Artifacts:
        Type: CODEPIPELINE

      Environment:
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: aws/codebuild/standard:8.0
        Type: LINUX_CONTAINER

        EnvironmentVariables:
          - Name: FRONTEND_BUCKET_NAME
            Value: !Ref FrontendBucketName

          - Name: CLOUDFRONT_DISTRIBUTION_ID
            Value: !Ref CloudFrontDistributionId

          - Name: BACKEND_API_URL
            Value: !Sub "http://${!ImportValue sprintly-backend-service-url}"

          - Name: DB_USER
            Value: !Ref DBUser

      Source:
        Type: CODEPIPELINE

      TimeoutInMinutes: 60

  SprintlyPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: sprintly-ci-pipeline
      RoleArn: !GetAtt PipelineRole.Arn

      ArtifactStore:
        Type: S3
        Location: !Ref PipelineArtifactBucket

      Stages:

        - Name: Source
          Actions:
            - Name: GitHubSource
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: '1'

              OutputArtifacts:
                - Name: SourceOutput

              Configuration:
                ConnectionArn: !Ref GitHubConnection
                FullRepositoryId: !Ref GitHubRepository
                BranchName: !Ref GitHubBranch

                # ✅ FIXED HERE
                OutputArtifactFormat: CODE_ZIP

              RunOrder: 1

        - Name: Build
          Actions:
            - Name: BuildAndPackage
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'

              InputArtifacts:
                - Name: SourceOutput

              OutputArtifacts:
                - Name: BuildOutput

              Configuration:
                ProjectName: !Ref SprintlyBuildProject

              RunOrder: 1

        - Name: Deploy
          Actions:
            - Name: DeployBackend
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CodeDeploy
                Version: '1'

              InputArtifacts:
                - Name: BuildOutput

              Configuration:
                ApplicationName: !ImportValue sprintly-codedeploy-application-name
                DeploymentGroupName: !ImportValue sprintly-codedeploy-deployment-group-name

              RunOrder: 1

Outputs:
  PipelineName:
    Value: !Ref SprintlyPipeline
    Export:
      Name: sprintly-pipeline-name

  PipelineArtifactBucket:
    Value: !Ref PipelineArtifactBucket
    Export:
      Name: sprintly-pipeline-artifact-bucket  PipelineArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub sprintly-pipeline-artifacts-${AWS::AccountId}-${AWS::Region}
      AccessControl: BucketOwnerFullControl
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodePipelinePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:*
                Resource: "*"

              - Effect: Allow
                Action:
                  - codebuild:*
                Resource: "*"

              - Effect: Allow
                Action:
                  - codedeploy:*
                Resource: "*"

              - Effect: Allow
                Action:
                  - codestar-connections:UseConnection
                Resource: "*"

              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource: "*"

  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonS3FullAccess
        - arn:aws:iam::aws:policy/AWSCodeDeployFullAccess
        - arn:aws:iam::aws:policy/CloudFrontFullAccess
        - arn:aws:iam::aws:policy/AmazonSSMFullAccess
        - arn:aws:iam::aws:policy/AmazonEC2FullAccess

  GitHubConnection:
    Type: AWS::CodeStarConnections::Connection
    Properties:
      ConnectionName: !Ref ConnectionName
      ProviderType: GitHub

  SprintlyBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: sprintly-build-project
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: aws/codebuild/standard:8.0
        Type: LINUX_CONTAINER
        PrivilegedMode: false
        EnvironmentVariables:
          - Name: FRONTEND_BUCKET_NAME
            Type: PLAINTEXT
            Value: !Ref FrontendBucketName
          - Name: CLOUDFRONT_DISTRIBUTION_ID
            Type: PLAINTEXT
            Value: !Ref CloudFrontDistributionId
          - Name: DB_USER
            Type: PLAINTEXT
            Value: !Ref DBUser
      Source:
        Type: CODEPIPELINE
      TimeoutInMinutes: 60

  SprintlyPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: sprintly-ci-pipeline
      RoleArn: !GetAtt PipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref PipelineArtifactBucket
      Stages:
        - Name: Source
          Actions:
            - Name: GitHubSource
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: '1'
              OutputArtifacts:
                - Name: SourceOutput
              Configuration:
                ConnectionArn: !Ref GitHubConnection
                FullRepositoryId: !Ref GitHubRepository
                BranchName: !Ref GitHubBranch
                OutputArtifactFormat: CODEBUILD_CLONE_REF
              RunOrder: 1
        - Name: Build
          Actions:
            - Name: BuildAndPackage
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: BuildOutput
              Configuration:
                ProjectName: !Ref SprintlyBuildProject
              RunOrder: 1
        - Name: Deploy
          Actions:
            - Name: DeployBackend
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CodeDeploy
                Version: '1'
              InputArtifacts:
                - Name: BuildOutput
              Configuration:
                ApplicationName: !ImportValue sprintly-codedeploy-application-name
                DeploymentGroupName: !ImportValue sprintly-codedeploy-deployment-group-name
              RunOrder: 1

Outputs:
  PipelineName:
    Description: Name of the Sprintly CodePipeline
    Value: !Ref SprintlyPipeline
    Export:
      Name: sprintly-pipeline-name
  PipelineArtifactBucket:
    Description: S3 artifact bucket for the pipeline
    Value: !Ref PipelineArtifactBucket
    Export:
      Name: sprintly-pipeline-artifact-bucket
